name: Build and Deploy to Azure VM
on:
  push:
    branches:
      - develop  # adjust if you deploy from a different branch v1
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
        
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '22'  # use your desired Node.js version
          
      - name: Install dependencies
        run: npm install
        
      - name: Build the project
        run: npm run build
        
      # Clean target directory first to avoid conflicts
      - name: Clean target directory on VM
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_PRIVATE_KEY }}
          port: ${{ secrets.VM_PORT }}
          script: |
            rm -rf ~/form-app/*
            mkdir -p ~/form-app
            
      # Copy files excluding node_modules to avoid conflicts
      - name: Copy files to VM
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_PRIVATE_KEY }}
          port: ${{ secrets.VM_PORT }}
          source: ".,!node_modules,!.git,!.github,!*.log"
          target: "/home/${{ secrets.VM_USERNAME }}/form-app"
          overwrite: true
          
      # Execute remote commands via SSH to install dependencies and restart the app
      - name: Execute remote SSH commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_PRIVATE_KEY }}
          port: ${{ secrets.VM_PORT }}
          script: |
            cd ~/form-app
            npm install --production
            # If using PM2, restart the app or start if not running:
            pm2 restart form-app || pm2 start server.js --name form-app